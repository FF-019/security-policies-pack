nist:[["GV","Govern"],["ID","Identify"],["PR","Protect"],["DE","Detect"],["RS","Respond"]]};
const EV={"AC-01":["impl","Role-based access matrix, signed by system owners"],"AC-02":["impl","Directory export: 0 shared accounts"],"AC-03":["part","MFA on VPN and email; 2 legacy admin consoles pending"],"AC-04":["impl","PAM approval tickets, 8-hour expiry"],"AC-05":["impl","Q3 access review report, 100% completed"],"AC-06":["part","Leaver report: 94% revoked within 24h"],"AC-07":["impl","MDM remote-wipe log"],
"DC-01":["part","Labelling at 81% of SharePoint libraries"],"DC-02":["impl","Encryption configuration baseline"],"DC-03":["impl","Approved external-sharing channels list"],"DC-04":["part","DLP in monitor mode on endpoints"],"DC-05":["impl","Certified disposal records"],"DC-06":["impl","Incident tickets tagged data-exposure"],
"IR-01":["impl","SOC intake SLA report"],"IR-02":["impl","Severity matrix v1.3"],"IR-03":["impl","EDR isolation playbook"],"IR-04":["part","Chain-of-custody form drafted, not trained"],"IR-05":["impl","Central incident log"],"IR-06":["gap","NCA reporting procedure not yet documented"],"IR-07":["impl","Post-incident reviews, last 4 closed ≤ 7 days"],
"RM-01":["impl","Risk methodology v2.0"],"RM-02":["impl","Risk committee minutes, Q1–Q3"],"RM-03":["part","2 of 3 high risks have approved plans"],"RM-04":["impl","Signed risk acceptances"],"RM-05":["gap","Supplier risk assessment not yet in procurement"],"RM-06":["impl","Monthly KRI dashboard"]};

</script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]);
const FWN={nca:"NCA ECC-2:2024",iso:"ISO/IEC 27001:2022",nist:"NIST CSF 2.0"};
const ST={impl:["Implemented","ok"],part:["Partial","warn"],gap:["Gap","bad"]};
const ALL=P.flatMap(p=>p.stmts.map(s=>({id:s[0],text:s[1],map:s[2],pol:p})));
const tags=m=>Object.entries(m).flatMap(([k,v])=>v.map(c=>`<span class="tag" title="${FWN[k]}">${k.toUpperCase()} ${esc(c)}</span>`)).join("");
const pill=k=>`<span class="pill ${ST[k][1]}">${ST[k][0]}</span>`;
const score=()=>{const v=Object.values(EV).map(e=>e[0]);return Math.round(v.reduce((a,k)=>a+(k==="impl"?1:k==="part"?.5:0),0)/v.length*100)};
const cnt=k=>Object.values(EV).filter(e=>e[0]===k).length;
const lvl=s=>s>=15?["Critical","bad","l4"]:s>=10?["High","bad","l3"]:s>=5?["Medium","warn","l2"]:["Low","ok","l1"];
const nMaps=ALL.reduce((a,s)=>a+Object.values(s.map).flat().length,0);
$("#nC").textContent=ALL.length;$("#nR").textContent=RISKS.length;$("#nE").textContent=Object.keys(EV).length;$("#nA").textContent=AR.length;

const V={};
V.overview=()=>{
 const byPol=P.map(p=>{const s=p.stmts.map(x=>EV[x[0]][0]);const v=Math.round(s.reduce((a,k)=>a+(k==="impl"?1:k==="part"?.5:0),0)/s.length*100);return[p,v,s.filter(k=>k!=="impl").length]});
 const open=Object.entries(EV).filter(([,e])=>e[0]!=="impl");
 return `<div class="vh"><div><h1>Security program overview</h1><p>Status of the four core policies, their controls and the evidence held against each one. Assessment period Q3 2026.</p></div></div>
 <div class="grid g4">
  <div class="card kpi"><small>Control readiness</small><b>${score()}%</b><div class="bar"><i style="width:${score()}%"></i></div></div>
  <div class="card kpi"><small>Policy statements</small><b>${ALL.length}</b><span>${cnt("impl")} implemented · ${cnt("part")} partial · ${cnt("gap")} gaps</span></div>
  <div class="card kpi"><small>Framework mappings</small><b>${nMaps}</b><span>NCA ECC · ISO 27001 · NIST CSF</span></div>
  <div class="card kpi"><small>Open high risks</small><b>${RISKS.filter(r=>r[2]*r[3]>=10).length}</b><span>of ${RISKS.length} in register</span></div>
 </div>
 <div class="grid g3" style="margin-top:16px">
  <div class="card"><h3>Readiness by policy <span>weighted: partial = 0.5</span></h3><div class="tw"><table><thead><tr><th>Policy</th><th>Owner</th><th style="width:34%">Readiness</th><th>Open</th></tr></thead><tbody>
  ${byPol.map(([p,v,o])=>`<tr class="click" onclick="go('policies/${p.id}')"><td><b style="font-weight:500">${p.title}</b><div class="note mono">${p.code}</div></td><td>${p.owner}</td><td><div style="display:flex;align-items:center;gap:8px"><div class="bar" style="flex:1"><i style="width:${v}%"></i></div><span class="mono">${v}%</span></div></td><td>${o?`<span class="pill warn">${o}</span>`:`<span class="pill ok">0</span>`}</td></tr>`).join("")}
  </tbody></table></div></div>
  <div class="card"><h3>Needs attention <span>${open.length}</span></h3><div class="tw"><table><tbody>
  ${open.map(([id,e])=>`<tr class="click" onclick="go('evidence')"><td class="mono" style="width:64px">${id}</td><td>${esc(e[1])}<div style="margin-top:4px">${pill(e[0])}</div></td></tr>`).join("")}
  </tbody></table></div></div>
 </div>`};

V.policies=(id)=>{
 const p=P.find(x=>x.id===id);
 if(!p) return `<div class="vh"><div><h1>Policies</h1><p>Controlled documents. Each follows the same structure: purpose, scope, numbered statements, roles, exceptions and review.</p></div></div>
 <div class="card tw"><table><thead><tr><th>ID</th><th>Title</th><th>Owner</th><th>Approver</th><th>Statements</th><th>Effective</th><th>Review</th><th>Status</th></tr></thead><tbody>
 ${P.map(p=>`<tr class="click" onclick="go('policies/${p.id}')"><td class="mono">${p.code}</td><td><b style="font-weight:500">${p.title}</b><div class="note">${p.short}</div></td><td>${p.owner}</td><td>${p.approver}</td><td>${p.stmts.length}</td><td>${p.effective}</td><td>${p.review}</td><td><span class="pill ok">Approved</span></td></tr>`).join("")}
 </tbody></table></div>`;
 return `<div class="vh"><div><div class="note mono"><a href="#policies">Policies</a> / ${p.code}</div><h1>${p.title}</h1><p>${p.short}</p></div><span class="pill ok">Approved · v2.0</span></div>
 <div class="grid g3"><div class="card pad doc">
  <h4 style="margin-top:0">1. Purpose</h4><p>${p.purpose}</p>
  <h4>2. Scope</h4><p>${p.scope}</p>
  <h4>3. Policy statements</h4><ol class="stm">${p.stmts.map(s=>`<li><span class="mono" style="color:var(--ink3)">${s[0]}</span><div>${esc(s[1])}<div style="margin-top:5px">${tags(s[2])} ${pill(EV[s[0]][0])}</div></div></li>`).join("")}</ol>
  <h4>4. Roles (RACI)</h4><div class="tw"><table><thead><tr><th>Activity</th>${p.raciCols.map(c=>`<th>${c}</th>`).join("")}</tr></thead><tbody>${p.raci.map(r=>`<tr><td>${r[0]}</td>${r.slice(1).map(x=>`<td class="mono" style="${x==="A"?"color:var(--acc);font-weight:600":""}">${x}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
  <h4>5. Exceptions</h4><p>${p.exceptions}</p>
  <h4>6. Example</h4><p>${p.scenario}</p>
 </div>
 <div class="grid" style="align-content:start">
  <div class="card pad"><dl class="meta"><dt>Document</dt><dd class="mono">${p.code}</dd><dt>Owner</dt><dd>${p.owner}</dd><dt>Approver</dt><dd>${p.approver}</dd><dt>Effective</dt><dd>${p.effective}</dd><dt>Review</dt><dd>${p.review}</dd></dl></div>
  <div class="card"><h3>Key indicators</h3><table><tbody>${p.kpis.map(k=>`<tr><td>${k[0]}</td><td class="mono" style="text-align:right">${esc(k[1])}</td></tr>`).join("")}</tbody></table></div>
  <div class="card"><h3>Supporting tooling</h3><div class="pad" style="padding-top:8px">${p.tools.map(t=>`<div style="padding:4px 0">${t}</div>`).join("")}</div></div>
 </div></div>`};

let cf="all";
V.controls=()=>`<div class="vh"><div><h1>Control library</h1><p>Every policy statement treated as a control and traced to the external requirements it satisfies.</p></div>
 <div class="seg">${[["all","All"],...P.map(p=>[p.id,p.code.slice(4)])].map(([k,l])=>`<button aria-pressed="${cf===k}" onclick="cf='${k}';render()">${l}</button>`).join("")}</div></div>
 <div class="card tw"><table><thead><tr><th>Control</th><th>Requirement</th><th>NCA ECC-2</th><th>ISO 27001</th><th>NIST CSF</th><th>Status</th></tr></thead><tbody id="ctb"></tbody></table></div>`;
function ctRows(){const q=($("#q").value||"").toLowerCase();const rows=ALL.filter(s=>(cf==="all"||s.pol.id===cf)&&(!q||(s.id+" "+s.text+" "+JSON.stringify(s.map)).toLowerCase().includes(q)));
 const t=$("#ctb");if(!t)return;t.innerHTML=rows.length?rows.map(s=>`<tr><td class="mono">${s.id}</td><td style="min-width:260px">${esc(s.text)}</td>${["nca","iso","nist"].map(k=>`<td>${(s.map[k]||[]).map(c=>`<span class="tag">${esc(c)}</span>`).join("")}</td>`).join("")}<td>${pill(EV[s.id][0])}</td></tr>`).join(""):`<tr><td colspan="6" class="empty">No controls match “${esc(q)}”.</td></tr>`}

V.frameworks=()=>{const sec=k=>DOM[k].map(([pre,label])=>{const hit=ALL.filter(s=>(s.map[k]||[]).some(c=>k==="iso"?(pre==="Cl."?c.startsWith("Cl."):c.split(".")[0]===pre&&!c.startsWith("Cl.")):c.startsWith(pre+(k==="nist"?".":"-"))));return[pre,label,hit]}).filter(r=>r[2].length);
 return `<div class="vh"><div><h1>Frameworks</h1><p>Coverage of each external framework by the policy set. Mapping is many-to-many: one statement can satisfy several requirements.</p></div></div>
 <div class="grid">${["nca","iso","nist"].map(k=>{const r=sec(k);const m=Math.max(...r.map(x=>x[2].length));return `<div class="card"><h3>${FWN[k]} <span>${r.length} areas covered</span></h3><div class="tw"><table><tbody>${r.map(([pre,label,h])=>`<tr><td class="mono" style="width:60px">${pre}</td><td style="width:34%">${label}</td><td><div style="display:flex;gap:8px;align-items:center"><div class="bar" style="flex:1;max-width:180px"><i style="width:${h.length/m*100}%"></i></div><span class="mono">${h.length}</span></div></td><td>${h.map(s=>`<span class="tag">${s.id}</span>`).join("")}</td></tr>`).join("")}</tbody></table></div></div>`}).join("")}</div>`};

let selR=0;
V.risks=()=>{const r=RISKS[selR],s=r[2]*r[3],L=lvl(s);
 let heat=`<div class="heat">`;for(let i=5;i>=1;i--){heat+=`<div class="ax">${i}</div>`;for(let l=1;l<=5;l++){const here=RISKS.map((x,j)=>[x,j]).filter(([x])=>x[3]===i&&x[2]===l);heat+=`<div class="c ${lvl(i*l)[2]}">${here.map(([x,j])=>`<span class="dot ${j===selR?"on":""}" onclick="selR=${j};render()">${x[0]}</span>`).join("")}</div>`}}heat+=`<div></div>${[1,2,3,4,5].map(n=>`<div class="ax">${n}</div>`).join("")}</div><div class="note" style="display:flex;justify-content:space-between;margin-top:6px"><span>↑ Impact</span><span>Likelihood →</span></div>`;
 return `<div class="vh"><div><h1>Risk register</h1><p>Scored on a 5×5 likelihood × impact matrix (RM-01). High and Critical risks require an approved treatment plan within 30 days (RM-03).</p></div></div>
 <div class="grid g3"><div class="card tw"><table><thead><tr><th>ID</th><th>Risk</th><th>Owner</th><th>L</th><th>I</th><th>Score</th><th>Rating</th></tr></thead><tbody>
 ${RISKS.map((x,j)=>{const q=lvl(x[2]*x[3]);return `<tr class="click" onclick="selR=${j};render()" style="${j===selR?"background:var(--accBg)":""}"><td class="mono">${x[0]}</td><td>${x[1]}</td><td>${x[5]}</td><td class="mono">${x[2]}</td><td class="mono">${x[3]}</td><td class="mono">${x[2]*x[3]}</td><td><span class="pill ${q[1]}">${q[0]}</span></td></tr>`}).join("")}
 </tbody></table></div>
 <div class="grid" style="align-content:start"><div class="card pad">${heat}</div>
 <div class="card"><h3>${r[0]} · ${r[1]}</h3><div class="pad"><dl class="meta"><dt>Inherent</dt><dd>${s} · ${L[0]}</dd><dt>Owner</dt><dd>${r[5]}</dd><dt>Treatment</dt><dd>${r[4]}</dd><dt>Plan due</dt><dd>${s>=10?"30 days from identification":"Next quarterly review"}</dd></dl></div></div></div></div>`};

let ef="all";
V.evidence=()=>`<div class="vh"><div><h1>Evidence</h1><p>What an auditor would be shown for each control, and where the gaps are.</p></div>
 <div class="seg">${[["all","All"],["impl","Implemented"],["part","Partial"],["gap","Gap"]].map(([k,l])=>`<button aria-pressed="${ef===k}" onclick="ef='${k}';render()">${l}${k!=="all"?` · ${cnt(k)}`:""}</button>`).join("")}</div></div>
 <div class="card tw"><table><thead><tr><th>Control</th><th>Policy</th><th>Evidence</th><th>Status</th></tr></thead><tbody>
 ${ALL.filter(s=>ef==="all"||EV[s.id][0]===ef).map(s=>`<tr><td class="mono">${s.id}</td><td class="mono note">${s.pol.code}</td><td>${esc(EV[s.id][1])}</td><td>${pill(EV[s.id][0])}</td></tr>`).join("")}
 </tbody></table></div>`;

const PH=[["Detect and report","Reported to SOC","IR-01",60],["Triage","Severity assigned","IR-02",90],["Contain","Workstation isolated","IR-03",240],["Eradicate","Malware removed","IR-04",480],["Recover","User restored","—",1440],["Post-incident review","Lessons recorded","IR-07",10080]];
let irs=-1;
const fmt=m=>m<60?m+" min":m<1440?Math.round(m/60)+" h":Math.round(m/1440)+" d";
V.incidents=()=>`<div class="vh"><div><h1>Incident drill</h1><p>Walk a reported phishing case through the Incident Response Policy and check each step against its deadline.</p></div>
 <div style="display:flex;gap:8px"><button class="btn" onclick="irs=-1;render()">Reset</button><button class="btn pri" ${irs>=PH.length-1?"disabled":""} onclick="irs++;render()">${irs<0?"Open incident":"Complete step"}</button></div></div>
 <div class="grid g3"><div class="card"><h3>INC-2026-0412 · Phishing, credential harvest <span>${irs<0?"Not started":irs>=PH.length-1?"Closed":"In progress"}</span></h3><div class="pad tl">
 ${PH.map((p,i)=>`<div class="${i<=irs?"done":i===irs+1&&irs>=0?"now":""}"><i></i><span>${p[0]}<span class="note"> · ${p[1]}</span></span><span class="mono note">${p[2]} · ≤ ${fmt(p[3])}</span></div>`).join("")}
 </div></div>
 <div class="card"><h3>Severity matrix</h3><table><tbody><tr><td class="mono">P1</td><td>Business-critical system or data breach</td><td class="mono">Contain ≤ 4 h</td></tr><tr><td class="mono">P2</td><td>Single user or host compromised</td><td class="mono">≤ 8 h</td></tr><tr><td class="mono">P3</td><td>Policy violation, no compromise</td><td class="mono">≤ 3 d</td></tr><tr><td class="mono">P4</td><td>Informational</td><td class="mono">Log only</td></tr></tbody></table></div></div>`;

let ard={};
V.access=()=>{const done=Object.keys(ard).length;
 return `<div class="vh"><div><h1>Quarterly access review</h1><p>Q4 2026 certification for Finance ERP and infrastructure. Each line is checked against the Access Control Policy.</p></div><span class="pill ${done===AR.length?"ok":"neu"}">${done} of ${AR.length} decided</span></div>
 <div class="card tw"><table><thead><tr><th>Account</th><th>Role</th><th>Access</th><th>Finding</th><th>Policy</th><th>Decision</th></tr></thead><tbody>
 ${AR.map((a,i)=>`<tr><td class="mono">${a[0]}</td><td>${a[1]}</td><td>${a[2]}</td><td>${a[4]?`<span class="pill bad">${a[3]}</span>`:`<span class="pill ok">${a[3]}</span>`}</td><td class="mono note">${a[4]||"—"}</td><td><div class="seg">${["Keep","Revoke"].map(d=>`<button aria-pressed="${ard[i]===d}" onclick="ard[${i}]='${d}';render()">${d}</button>`).join("")}</div>${ard[i]&&((ard[i]==="Keep")===!!a[4])?`<div class="note" style="color:var(--bad);margin-top:4px">${a[4]?"Conflicts with "+a[4].split(" ")[0]:"Access matches role"}</div>`:""}</td></tr>`).join("")}
 </tbody></table></div>`};

let cs=3;
V.classify=()=>{const L=LB[CL[cs][1]];
 return `<div class="vh"><div><h1>Data handling</h1><p>Pick an information asset to see its label and the handling rules from the Data Classification Policy.</p></div></div>
 <div class="grid g2"><div class="card tw"><table><thead><tr><th>Asset</th><th>Label</th></tr></thead><tbody>
 ${CL.map((c,i)=>`<tr class="click" onclick="cs=${i};render()" style="${i===cs?"background:var(--accBg)":""}"><td>${c[0]}</td><td><span class="pill ${c[1]==="PUBLIC"?"ok":c[1]==="INTERNAL"?"neu":c[1]==="HIGHLY"?"bad":"warn"}">${LB[c[1]][0]}</span></td></tr>`).join("")}
 </tbody></table></div>
 <div class="card"><h3>${CL[cs][0]} <span>${L[0]}</span></h3><div class="pad"><p style="margin:0 0 10px;color:var(--ink2)">${L[1]}</p>${L[2].map(r=>`<div style="padding:7px 0;border-top:1px solid var(--line2)">${r}</div>`).join("")}</div></div></div>`};

const TITLES={overview:"Overview",policies:"Policies",controls:"Controls",frameworks:"Frameworks",risks:"Risk register",evidence:"Evidence",incidents:"Incident drill",access:"Access review",classify:"Data handling"};
function go(h){location.hash=h}
function render(){let [v,arg]=(location.hash.slice(1)||"overview").split("/");if(!V[v])v="overview";
 $("#view").innerHTML=V[v](arg);$("#crumb").textContent=TITLES[v];
 document.querySelectorAll(".side a").forEach(a=>a.toggleAttribute("aria-current",a.getAttribute("href")==="#"+v));
 if(v==="controls")ctRows();document.body.classList.remove("open")}
$("#q").addEventListener("input",()=>{if(!location.hash.startsWith("#controls"))go("controls");else ctRows()});
addEventListener("hashchange",()=>{render();scrollTo(0,0)});
render();
</script>
</body>
</html>
